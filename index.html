<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>測試環境儀錶板</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#f5f3ef;--panel:#ffffff;--card:#ffffff;--sidebar:#faf9f6;
  --border:#e2ddd6;--border2:#cdc7bc;
  --ink:#2c2825;--ink2:#5a5450;--muted:#9b9289;--label:#7a7068;
  --sage:#5c7a6e;--sage-lt:#eef3f1;--sage-md:#a8c4bb;
  --rust:#b05a3a;--rust-lt:#fdf0ec;
  --clay:#7a6a5a;--clay-lt:#f0ede8;
  --gold:#8b7355;
  --amber:#b8863a;--amber-lt:#fdf3e3;
  --serif:'Noto Serif TC',serif;--sans:'Noto Sans TC',sans-serif;--mono:'DM Mono',monospace;
  --r:10px;--shadow:0 2px 12px rgba(44,40,37,.07);--shadow2:0 4px 24px rgba(44,40,37,.11);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.logo{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink);letter-spacing:.03em}
.logo em{color:var(--sage);font-style:normal}
.env-badge{font-family:var(--mono);font-size:10px;letter-spacing:.12em;background:var(--sage-lt);border:1px solid var(--sage-md);color:var(--sage);padding:3px 10px;border-radius:20px}
.topbar-right{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:10px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--sage);animation:blink 2.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.tb-btn{font-family:var(--sans);font-size:11px;border:1px solid var(--border2);background:transparent;color:var(--ink2);padding:5px 11px;border-radius:6px;cursor:pointer;transition:.15s}
.tb-btn:hover{border-color:var(--sage);color:var(--sage)}

.layout{display:grid;grid-template-columns:1fr}
@media(min-width:960px){.layout{grid-template-columns:210px 1fr}}

.sidebar{background:var(--sidebar);border-right:1px solid var(--border);min-height:calc(100vh - 53px);display:flex;flex-direction:column;justify-content:space-between}
.side-nav{display:flex;flex-direction:column;padding:14px 10px}
.side-nav-item{display:flex;align-items:center;gap:9px;padding:11px 12px;border:none;border-radius:8px;background:transparent;color:var(--ink2);font-family:var(--sans);font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;transition:.15s;margin-bottom:3px}
.side-nav-item:hover{background:var(--panel);color:var(--ink)}
.side-nav-item.active{background:var(--sage-lt);color:var(--sage);font-weight:700}
.sni-ico{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.side-info{padding:14px 18px;border-top:1px solid var(--border);font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.9}

.creds-panel{padding:18px}

.creds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cred-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.cred-head{display:flex;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid var(--border)}
.cred-head h3{font-family:var(--serif);font-size:14px;font-weight:600;letter-spacing:.03em}
.cred-edit-btn{background:transparent;border:none;cursor:pointer;font-size:14px;color:var(--muted);padding:4px 6px;border-radius:5px}
.cred-edit-btn:hover{color:var(--sage);background:var(--sage-lt)}
.cred-body{padding:4px 0}
.cr{display:flex;align-items:baseline;padding:7px 15px;border-bottom:1px solid #f0ede8}
.cr:last-child{border-bottom:none}
.cr-lbl{font-family:var(--mono);font-size:14px;color:var(--label);min-width:82px;flex-shrink:0;letter-spacing:.02em;font-weight:500}
.cr-val{font-family:var(--mono);font-size:14px;color:var(--ink);word-break:break-all}
.cr.pay{border-left:3px solid var(--sage);background:var(--sage-lt);padding:10px 15px}
.cr.pay .cr-lbl{color:var(--sage);font-weight:600}
.cr.pay .cr-val{font-size:22px;font-weight:700;color:var(--sage);letter-spacing:.18em}
.cred-note{font-size:12px;padding:8px 15px;border-top:1px solid var(--border);color:var(--rust);background:var(--rust-lt);line-height:1.6;word-break:break-all;overflow-wrap:anywhere}
.cred-note a{color:var(--rust);font-weight:600;text-decoration:underline}
.cred-note a:hover{color:#8a3f26}

.main{padding:24px}

/* --- gantt timeline --- */
.gantt-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);margin-bottom:24px}
.gantt-range-label{font-family:var(--mono);font-size:11px;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--border)}
.gantt-header{display:flex;border-bottom:1px solid var(--border)}
.gantt-header-label{width:220px;flex-shrink:0;padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--label)}
.gantt-header-months{flex:1;display:flex;position:relative}
.gantt-month{text-align:center;padding:9px 0;font-size:13.5px;font-weight:600;color:var(--ink2);border-right:1px solid var(--border2)}
.gantt-month:last-child{border-right:none}
.gantt-month-line{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--border2);z-index:1}
.gantt-body{position:relative}
.gantt-timeline{position:relative}
.gantt-full-overlay{position:absolute;top:0;bottom:0;left:220px;right:0;pointer-events:none}
.gantt-today{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed var(--rust);z-index:2;pointer-events:none}
.gantt-today-lbl{position:absolute;top:2px;left:5px;font-size:10px;color:var(--rust);font-family:var(--mono);white-space:nowrap}
.gantt-today-badge{position:absolute;bottom:-11px;transform:translateX(-50%);background:var(--rust);color:#fff;font-size:10px;font-family:var(--mono);padding:2px 8px;border-radius:10px;white-space:nowrap;z-index:3;box-shadow:0 2px 6px rgba(176,90,58,.35)}
.gantt-row{display:flex;align-items:center;border-bottom:1px solid #f0ede8;min-height:46px}
.gantt-row:last-child{border-bottom:none}
.gantt-label{width:220px;flex-shrink:0;padding:8px 14px;display:flex;align-items:baseline;gap:8px;overflow:hidden}
.gantt-label-code{font-family:var(--mono);font-size:13.5px;font-weight:600;color:var(--ink);flex-shrink:0}
.gantt-label-name{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt-track{flex:1;position:relative;height:34px}
.gantt-bar{position:absolute;top:5px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:12.5px;white-space:nowrap;overflow:hidden;padding:0 8px;font-family:var(--mono);z-index:5}
.gb-overdue{background:var(--clay-lt);color:var(--muted);border:1px solid var(--border2)}
.gb-danger{background:var(--rust-lt);color:var(--rust);border:1px solid var(--rust)}
.gb-warning{background:var(--amber-lt);color:var(--amber);border:1px solid var(--amber)}
.gb-success{background:var(--sage-lt);color:var(--sage);border:1px solid var(--sage-md)}
.gb-upcoming{background:transparent;color:var(--muted);border:1px dashed var(--border2)}
.gantt-legend{display:flex;flex-wrap:wrap;gap:14px;padding:10px 14px;font-size:11px;color:var(--muted);border-top:1px solid var(--border)}
.gantt-legend-dot{display:inline-block;width:11px;height:9px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.gantt-empty{padding:24px;text-align:center;color:var(--muted);font-size:13px}

.sec-hd{display:flex;align-items:center;margin-bottom:14px;gap:12px}
.sec-title{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--ink);white-space:nowrap}
.sec-line{flex:1;height:1px;background:var(--border)}

.task-form{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:24px;box-shadow:var(--shadow)}
.form-sub{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;margin-bottom:16px}
.f-group{display:flex;flex-direction:column;gap:5px}
.f-label{font-size:11px;color:var(--label);font-weight:500}
.f-input,.f-select{background:#faf9f6;border:1px solid var(--border2);border-radius:7px;padding:9px 12px;color:var(--ink);font-family:var(--sans);font-size:14px;outline:none;transition:.2s;width:100%}
.f-input:focus,.f-select:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgba(92,122,110,.12);background:var(--panel)}
.f-select option{background:var(--panel)}
.members-wrap,.contacts-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.member-chip,.contact-chip{padding:5px 13px;border-radius:20px;font-size:12px;border:1px solid var(--border2);background:var(--bg);cursor:pointer;transition:.18s;user-select:none;color:var(--ink2);display:flex;align-items:center;gap:5px}
.member-chip:hover,.contact-chip:hover{border-color:var(--sage);color:var(--sage)}
.member-chip.active{background:var(--sage-lt);border-color:var(--sage);color:var(--sage);font-weight:600}
.contact-chip.active{background:var(--rust-lt);border-color:var(--rust);color:var(--rust);font-weight:600}
.dot2{width:6px;height:6px;border-radius:50%;background:var(--border2);flex-shrink:0;transition:.18s}
.member-chip.active .dot2{background:var(--sage)}
.status-sel{display:flex;gap:5px;height:38px}
.ss-opt{flex:1;border:1px solid var(--border2);border-radius:7px;background:var(--bg);color:var(--muted);font-size:12px;cursor:pointer;text-align:center;transition:.15s;display:flex;align-items:center;justify-content:center}
.ss-opt:hover{border-color:var(--sage-md);color:var(--ink)}
.ss-opt.active-todo{border-color:var(--clay);color:var(--clay);background:var(--clay-lt);font-weight:600}
.ss-opt.active-doing{border-color:var(--rust);color:var(--rust);background:var(--rust-lt);font-weight:600}
.ss-opt.active-done{border-color:var(--sage);color:var(--sage);background:var(--sage-lt);font-weight:600}
.btn-row{display:flex;gap:10px;margin-top:18px}
.btn{padding:9px 22px;border:none;border-radius:7px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.btn-primary{background:var(--sage);color:#fff;box-shadow:0 2px 8px rgba(92,122,110,.3)}
.btn-primary:hover{background:#4d6b5f}
.btn-outline{background:transparent;color:var(--ink2);border:1px solid var(--border2)}
.btn-outline:hover{border-color:var(--ink2)}
.btn-print{background:var(--sage-lt);color:var(--sage);border:1px solid var(--sage-md);font-weight:600}
.btn-print:hover{background:var(--sage);color:#fff}

.tasks-list{display:flex;flex-direction:column;gap:12px}
.task-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);transition:.2s}
.task-item:hover{box-shadow:var(--shadow2);border-color:var(--border2)}
.task-main{display:flex;align-items:center;gap:12px;padding:14px 16px}
.task-status-bar{width:4px;height:36px;border-radius:3px;flex-shrink:0}
.task-name-wrap{flex:1;min-width:0}
.task-name{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--ink)}
.task-sub{font-size:12px;color:var(--muted);margin-top:1px}
.task-meta{display:flex;align-items:center;gap:6px;flex-shrink:0}
.inline-st{padding:5px 11px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;transition:.15s;white-space:nowrap}
.inline-st:hover{border-color:var(--sage-md);color:var(--ink)}
.ist-todo{border-color:var(--clay)!important;color:var(--clay)!important;background:var(--clay-lt)!important;font-weight:600!important}
.ist-doing{border-color:var(--rust)!important;color:var(--rust)!important;background:var(--rust-lt)!important;font-weight:600!important}
.ist-done{border-color:var(--sage)!important;color:var(--sage)!important;background:var(--sage-lt)!important;font-weight:600!important}
.task-expand{font-size:18px;color:var(--muted);cursor:pointer;transition:.2s;padding:0 4px;line-height:1}
.task-item.open .task-expand{transform:rotate(90deg)}

.task-detail{display:none;border-top:1px solid var(--border);padding:18px;background:#faf9f6}
.task-item.open .task-detail{display:block}
.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.eg-full{grid-column:1/-1}
.edit-label{font-size:11px;color:var(--label);font-weight:500;margin-bottom:4px}
.edit-input,.edit-select{background:var(--panel);border:1px solid var(--border2);border-radius:7px;padding:8px 11px;color:var(--ink);font-family:var(--sans);font-size:14px;outline:none;transition:.2s;width:100%}
.edit-input:focus,.edit-select:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgba(92,122,110,.1)}
.edit-select option{background:var(--panel)}
.edit-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.edit-chip{padding:4px 11px;border-radius:20px;font-size:12px;border:1px solid var(--border2);background:var(--panel);cursor:pointer;transition:.15s;user-select:none;color:var(--ink2)}
.edit-chip:hover{border-color:var(--sage);color:var(--sage)}
.edit-chip.active-m{background:var(--sage-lt);border-color:var(--sage);color:var(--sage);font-weight:600}
.edit-chip.active-c{background:var(--rust-lt);border-color:var(--rust);color:var(--rust);font-weight:600}
.edit-status{display:flex;gap:5px}
.es-opt{flex:1;padding:7px;border:1px solid var(--border2);border-radius:7px;background:var(--panel);color:var(--muted);font-size:12px;cursor:pointer;text-align:center;transition:.15s}
.es-opt.es-todo{border-color:var(--clay);color:var(--clay);background:var(--clay-lt);font-weight:600}
.es-opt.es-doing{border-color:var(--rust);color:var(--rust);background:var(--rust-lt);font-weight:600}
.es-opt.es-done{border-color:var(--sage);color:var(--sage);background:var(--sage-lt);font-weight:600}
.task-actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--border)}

.empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:14px;border:1.5px dashed var(--border2);border-radius:var(--r)}
.empty .e-icon{font-size:32px;margin-bottom:10px;opacity:.4;display:block}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(44,40,37,.4);backdrop-filter:blur(5px);z-index:500;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:24px;width:90%;max-width:460px;box-shadow:var(--shadow2);max-height:86vh;overflow-y:auto}
.modal-title{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--ink);margin-bottom:18px}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}

.toast{position:fixed;bottom:24px;right:24px;z-index:999;background:var(--sage-lt);border:1px solid var(--sage-md);color:var(--sage);font-size:13px;padding:11px 18px;border-radius:8px;transform:translateY(60px);opacity:0;transition:.3s;pointer-events:none;box-shadow:var(--shadow2)}
.toast.err{background:var(--rust-lt);border-color:var(--rust);color:var(--rust)}
.toast.show{transform:none;opacity:1}

input[type="date"]::-webkit-calendar-picker-indicator{opacity:.5;cursor:pointer;filter:sepia(.5) hue-rotate(100deg)}
a{color:var(--sage);font-size:11px}

.info-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.info-bar b{color:var(--sage)}
.sidebar-sec{font-family:var(--serif);font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:10px;margin-top:18px}
.sb-task{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:10px 13px;margin-bottom:8px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.sb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sb-info{flex:1;min-width:0}
.sb-name{font-family:var(--serif);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-meta{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:1px}
.sb-btns{display:flex;gap:3px;flex-shrink:0}
.sb-btn{width:24px;height:24px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;font-size:10px;transition:.15s}
.sb-btn:hover{border-color:var(--sage);color:var(--sage)}
.sb-btn.act-todo{border-color:var(--clay)!important;color:var(--clay)!important;background:var(--clay-lt)!important}
.sb-btn.act-doing{border-color:var(--rust)!important;color:var(--rust)!important;background:var(--rust-lt)!important}
.sb-btn.act-done{border-color:var(--sage)!important;color:var(--sage)!important;background:var(--sage-lt)!important}

/* --- login --- */
.login-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.login-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow2);padding:38px 32px;width:100%;max-width:360px;text-align:center}
.login-card .logo{margin-bottom:4px;font-size:19px;justify-content:center;display:flex;gap:8px}
.login-sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:22px;letter-spacing:.08em}
.login-card input{text-align:center;letter-spacing:.15em;font-family:var(--mono)}
.login-err{color:var(--rust);font-size:12px;margin-top:12px;display:none}
.login-card .btn{width:100%;margin-top:14px}

/* --- credential editor --- */
.cred-field-row{display:grid;grid-template-columns:1fr 1fr auto auto;gap:6px;align-items:center;margin-bottom:8px}
.cred-pay-check{font-size:10px;color:var(--label);display:flex;align-items:center;gap:3px;white-space:nowrap}
.field-del-btn{background:transparent;border:1px solid var(--border2);color:var(--rust);border-radius:6px;width:30px;height:34px;cursor:pointer;font-size:13px}
.field-del-btn:hover{background:var(--rust-lt)}

/* --- backup panel --- */
.backup-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--muted)}
.backup-row{display:flex;justify-content:space-between;align-items:center;padding:7px 2px;border-bottom:1px dashed #ede9e3;font-size:12px}
.backup-row:last-child{border-bottom:none}
.backup-list{max-height:280px;overflow-y:auto;margin-top:6px}

@media(max-width:959px){
  .sidebar{border-right:none;border-bottom:1px solid var(--border);min-height:unset}
  .edit-grid{grid-template-columns:1fr}.eg-full{grid-column:1}
  .cred-field-row{grid-template-columns:1fr 1fr;grid-template-rows:auto auto}
}
</style>
</head>
<body>

<!-- ===== 登入畫面 ===== -->
<div class="login-overlay" id="login-overlay">
  <div class="login-card">
    <div class="logo">測試環境 <em style="color:var(--sage)">儀錶板</em></div>
    <div class="login-sub">POSTEAM · INTERNAL ONLY</div>
    <div class="f-group">
      <input class="f-input" id="login-pw" type="password" placeholder="請輸入共用密碼" autocomplete="off" />
    </div>
    <button class="btn btn-primary" id="login-btn" onclick="doLogin()">登入</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- ===== 主程式（登入後顯示） ===== -->
<div id="app-root" style="display:none">

<div class="topbar">
  <div style="display:flex;align-items:center;gap:12px">
    <div class="logo">測試環境 <em>儀錶板</em></div>
    <div class="env-badge">TEST ENV</div>
  </div>
  <div class="topbar-right">
    <div class="live-dot"></div>
    <span id="clock"></span>
    <button class="tb-btn" onclick="doLogout()">登出</button>

/* ============ 登入 / 登出 ============ */

auth.onAuthStateChanged(user=>{

/* ============ Firestore 即時同步 ============ */
function startListeners(){
  unsubTasks=db.collection('tasks').orderBy('createdAt','desc').onSnapshot(snap=>{
    tasks=snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  },err=>{console.error(err);showToast('讀取任務資料失敗，請確認 Firestore 設定','err');});

  unsubCreds=db.collection('credentials').orderBy('order','asc').onSnapshot(snap=>{
    credentials=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderCredentials();
    populateSystemSelect();
    render();
  },err=>{console.error(err);showToast('讀取帳密資料失敗，請確認 Firestore 設定','err');});

  unsubBackups=db.collection('backups').orderBy('createdAt','desc').limit(20).onSnapshot(snap=>{
    backups=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderBackupInfo();
  },err=>{console.error(err);});
}
function stopListeners(){
  if(unsubTasks)unsubTasks();
  if(unsubCreds)unsubCreds();
  if(unsubBackups)unsubBackups();
  unsubTasks=unsubCreds=unsubBackups=null;
  tasks=[];credentials=[];backups=[];
}

/* ============ 導覽切換 ============ */
const VIEWS=['overview','newtask','creds','backup','sample'];
function showView(v){

/* ============ 表單狀態 ============ */
function setFormStatus(s){

function toggleMember(el,name){el.classList.toggle('active');if(el.classList.contains('active'))selectedMembers.push(name);else selectedMembers=selectedMembers.filter(m=>m!==name);}
function toggleContact(el,name){el.classList.toggle('active');if(el.classList.contains('active'))selectedContacts.push(name);else selectedContacts=selectedContacts.filter(c=>c!==name);}
function clearForm(){

function getAllSystemOptions(){
  return [''].concat(credentials.map(c=>c.systemName)).concat(OTHER_SYSTEMS);
}

  sel.innerHTML=getAllSystemOptions().map(s=>`<option value="${s}">${s||'— 選擇 —'}</option>`).join('');

/* ============ 任務編號自動流水號（Firestore transaction） ============ */
function getNextTaskCode(){
  const counterRef=db.collection('meta').doc('taskCounter');
  return db.runTransaction(async tx=>{
    const doc=await tx.get(counterRef);
    const current=doc.exists?(doc.data().value||0):0;
    const next=current+1;
    tx.set(counterRef,{value:next});
    return next;
  }).then(next=>'T'+String(next).padStart(3,'0'));
}

/* ============ 任務 CRUD（Firestore） ============ */
function addTask(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){showToast('請輸入任務名稱','err');return;}
  getNextTaskCode().then(code=>{
    const data={
      code,name,status:formStatus,system:document.getElementById('f-system').value,
      start:document.getElementById('f-start').value,end:document.getElementById('f-end').value,
      members:[...selectedMembers],contacts:[...selectedContacts],
      notes:document.getElementById('f-notes').value.trim(),
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    };
    return db.collection('tasks').add(data);
  }).then(()=>{clearForm();showToast('✓ 任務已新增');scheduleBackup();})
    .catch(e=>showToast('新增失敗：'+e.message,'err'));
}

function saveEdit(id){
  const n=document.getElementById(`e-name-${id}`).value.trim();
  const data={
    system:document.getElementById(`e-sys-${id}`).value,
    start:document.getElementById(`e-start-${id}`).value,

/* ============ 任務渲染 ============ */
/* ============ 甘特圖時間軸 ============ */
function parseDateOnly(s){
  if(!s)return null;
  const [y,m,d]=s.split('-').map(Number);
  return new Date(y,m-1,d);
}
function workdaysBetween(from,to){
  let count=0;const d=new Date(from);
  while(d<=to){
    const day=d.getDay();
    if(day!==0&&day!==6)count++;
    d.setDate(d.getDate()+1);
  }
  return count;
}
function taskUrgency(t){
  const start=parseDateOnly(t.start),end=parseDateOnly(t.end);
  if(!start||!end)return null;
  const today=new Date();today.setHours(0,0,0,0);
  if(start>today)return{level:'upcoming',tag:'尚未開始'};
  if(end<today)return{level:'overdue',tag:'已逾期'};
  const remain=workdaysBetween(today,end);
  if(remain<3)return{level:'danger',tag:remain+'個工作天'};
  if(remain<10)return{level:'warning',tag:remain+'個工作天'};
  return{level:'success',tag:remain+'個工作天'};
}
function renderGantt(){
  const wrap=document.getElementById('gantt-wrap');
  if(!wrap)return;
  const scheduled=tasks.filter(t=>t.start&&t.end);
  if(!scheduled.length){
    wrap.innerHTML='<div class="gantt-wrap"><div class="gantt-empty">尚無已排定起訖日期的任務可顯示時間軸</div></div>';
    return;
  }
  const todayForRange=new Date();todayForRange.setHours(0,0,0,0);
  const rangeStart=new Date(todayForRange.getFullYear(),todayForRange.getMonth()-1,1);
  const rangeEnd=new Date(todayForRange.getFullYear(),todayForRange.getMonth()+2,0);
  const totalDays=Math.max(1,Math.round((rangeEnd-rangeStart)/86400000)+1);

  const months=[];
  let cur=new Date(rangeStart.getFullYear(),rangeStart.getMonth(),1);
  while(cur<=rangeEnd){
    const monthStart=cur<rangeStart?rangeStart:cur;
    const monthEndRaw=new Date(cur.getFullYear(),cur.getMonth()+1,0);
    const monthEnd=monthEndRaw>rangeEnd?rangeEnd:monthEndRaw;
    const days=Math.round((monthEnd-monthStart)/86400000)+1;
    months.push({label:(cur.getMonth()+1)+'月',widthPct:days/totalDays*100});
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }
  const dividerPcts=[0];
  let acc=0;
  months.slice(0,-1).forEach(m=>{acc+=m.widthPct;dividerPcts.push(acc);});

  const today=new Date();today.setHours(0,0,0,0);
  const todayPct=(today-rangeStart)/86400000/totalDays*100;
  const showToday=todayPct>=0&&todayPct<=100;

  const visible=scheduled.filter(t=>{
    const s=parseDateOnly(t.start),e=parseDateOnly(t.end);
    return e>=rangeStart&&s<=rangeEnd;
  }).sort((a,b)=>(a.code||'').localeCompare(b.code||'',undefined,{numeric:true}));

  const rowsHtml=visible.length?visible.map(t=>{
    try{
    const s=parseDateOnly(t.start),e=parseDateOnly(t.end);
    let left=(s-rangeStart)/86400000/totalDays*100;
    let right=(e-rangeStart)/86400000/totalDays*100+ (1/totalDays*100);
    left=Math.max(0,left);right=Math.min(100,right);
    const width=Math.max(2,right-left);
    const u=taskUrgency(t);
    return`<div class="gantt-row">
      <div class="gantt-label">
        <div class="gantt-label-code">${t.code||'—'}</div>
        <div class="gantt-label-name">${t.name||''}</div>
      </div>
      <div class="gantt-track">
        <div class="gantt-bar gb-${u.level}" style="left:${left}%;width:${width}%">
          <span>${t.start.slice(5).replace('-','')}–${t.end.slice(5).replace('-','')}</span>
        </div>
      </div>
    </div>`;
    }catch(err){
      console.error('甘特列渲染失敗，已略過此筆：',t,err);
      return'';
    }
  }).join(''):'<div class="gantt-empty">目前 3 個月區間內尚無已排定日期的任務</div>';

  wrap.innerHTML=`<div class="gantt-wrap">
    <div class="gantt-range-label">顯示範圍：${rangeStart.getMonth()+1}/${rangeStart.getDate()} － ${rangeEnd.getMonth()+1}/${rangeEnd.getDate()}（固定3個月視窗，以今日為中心）</div>
    <div class="gantt-timeline">

function linkifyNote(text){
  if(!text)return'';
  return text.replace(/(https?:\/\/[^\s]+)/g,url=>`<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
}

function openCredModal(id){
  editingCredId=id;

  document.getElementById('cred-modal-title').textContent=c?'編輯帳密卡片':'新增帳密卡片';

  document.getElementById('cred-note').value=c?(c.note||''):'';

function renderCredFieldsEditor(){
  const wrap=document.getElementById('cred-fields-editor');
  wrap.innerHTML=editingCredFields.map((f,i)=>`
    <div class="cred-field-row">
      <input class="edit-input" placeholder="欄位名稱 (如:帳號)" value="${(f.label||'').replace(/"/g,'&quot;')}" oninput="editingCredFields[${i}].label=this.value">
      <input class="edit-input" placeholder="值" value="${(f.value||'').replace(/"/g,'&quot;')}" oninput="editingCredFields[${i}].value=this.value">
      <label class="cred-pay-check"><input type="checkbox" ${f.pay?'checked':''} onchange="editingCredFields[${i}].pay=this.checked">主付款碼</label>
      <button class="field-del-btn" onclick="removeCredField(${i})">✕</button>
    </div>`).join('');
}
function addCredField(){editingCredFields.push({label:'',value:'',pay:false});renderCredFieldsEditor();}
function removeCredField(i){editingCredFields.splice(i,1);renderCredFieldsEditor();}

function saveCred(){
  const sysname=document.getElementById('cred-sysname').value.trim();
  if(!sysname){showToast('請輸入系統名稱','err');return;}
  const note=document.getElementById('cred-note').value.trim();
  const fields=editingCredFields.filter(f=>(f.label||'').trim()||(f.value||'').trim());
  const data={systemName:sysname,note,fields,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
  if(editingCredId){
    db.collection('credentials').doc(editingCredId).update(data)
      .then(()=>{closeCredModal();showToast('✓ 已更新');scheduleBackup();})
      .catch(e=>showToast('更新失敗：'+e.message,'err'));
  }else{
    data.order=credentials.length;
    data.createdAt=firebase.firestore.FieldValue.serverTimestamp();
    db.collection('credentials').add(data)
      .then(()=>{closeCredModal();showToast('✓ 已新增');scheduleBackup();})
      .catch(e=>showToast('新增失敗：'+e.message,'err'));
  }
}
function deleteCred(){
  if(!editingCredId)return;
  if(!confirm('確定刪除此帳密卡片？'))return;
  db.collection('credentials').doc(editingCredId).delete()
    .then(()=>{closeCredModal();showToast('✓ 已刪除');scheduleBackup();})
    .catch(e=>showToast('刪除失敗：'+e.message,'err'));
}

/* ============ 備份 / 還原（Firestore） ============ */
function scheduleBackup(){
  clearTimeout(backupTimer);
  backupTimer=setTimeout(()=>doBackupNow('auto'),5000);
}
function doBackupNow(trigger){
  trigger=trigger||'manual';
  const snapshot={
    credentials:credentials.map(({id,...rest})=>rest),
    tasks:tasks.map(({id,...rest})=>rest)
  };
  db.collection('backups').add({
    snapshot:JSON.stringify(snapshot),trigger,
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(()=>{if(trigger==='manual')showToast('✓ 已手動備份');})
    .catch(e=>{console.error('備份失敗',e);if(trigger==='manual')showToast('備份失敗：'+e.message,'err');});
}
function renderBackupInfo(){
  const label=(()=>{
    if(!backups.length||!backups[0].createdAt)return'尚無備份紀錄';
    const d=backups[0].createdAt.toDate();
    return'最後備份時間：'+d.toLocaleString('zh-TW');
  })();
  const t1=document.getElementById('last-backup-time');if(t1)t1.textContent=label;

  const listEl=document.getElementById('backup-list');
  if(listEl){
    listEl.innerHTML=backups.length?backups.map(b=>{
      const d=b.createdAt?b.createdAt.toDate().toLocaleString('zh-TW'):'—';
      return`<div class="backup-row"><span>${d}　<span style="color:var(--muted);font-size:10px">(${b.trigger==='auto'?'自動':'手動'})</span></span><button class="btn btn-outline" style="padding:4px 10px;font-size:11px" onclick="restoreBackup('${b.id}')">還原</button></div>`;
    }).join(''):'<div style="color:var(--muted);font-size:12px;padding:8px 2px">尚無備份紀錄</div>';
  }
}

function restoreBackup(id){
  const b=backups.find(b=>b.id===id);if(!b)return;
  if(!confirm('還原將覆蓋目前所有帳密與任務資料，確定繼續？'))return;
  let snap;
  try{snap=JSON.parse(b.snapshot);}catch(e){showToast('備份資料損毀','err');return;}
  Promise.all([db.collection('tasks').get(),db.collection('credentials').get()]).then(([tSnap,cSnap])=>{
    const batch=db.batch();
    tSnap.forEach(d=>batch.delete(d.ref));
    cSnap.forEach(d=>batch.delete(d.ref));
    (snap.tasks||[]).forEach(t=>{const ref=db.collection('tasks').doc();batch.set(ref,t);});
    (snap.credentials||[]).forEach(c=>{const ref=db.collection('credentials').doc();batch.set(ref,c);});
    return batch.commit();
  }).then(()=>{showToast('✓ 已還原備份');})
    .catch(e=>showToast('還原失敗：'+e.message,'err'));
}

  <button class="btn-print" onclick="window.print()">🖨 列印 / 儲存 PDF</button>
</div>
<div class="page">
  <div class="report-header">
    <div class="header-accent"></div>
    <div class="header-body">
      <div class="report-title">${t.name} 測試清單 <span>TEST CHECKLIST</span></div>
      <div class="header-meta">
        <div class="meta-item"><span class="meta-label">日期</span><span>${today}</span></div>
        <div class="meta-item"><span class="meta-label">支付</span><span>${t.system||'—'}</span></div>
        <div class="meta-item"><span class="meta-label">期間</span><span>${t.start||'—'} ～ ${t.end||'—'}</span></div>
        <div class="meta-item"><span class="meta-label">測試人員</span><span>${(t.members||[]).join('、')||'—'}</span></div>
        <div class="meta-item"><span class="meta-label">配合窗口</span><span>${(t.contacts||[]).join('、')||'—'}</span></div>
        <div class="meta-item"><span class="meta-label">狀態</span><span>${si.label}</span></div>
        ${t.notes?`<div class="meta-item"><span class="meta-label">備註</span><span>${t.notes}</span></div>`:''}
      </div>
    </div>
  </div>
  <div class="creds-strip">${buildCredStripHtml(t.system)}</div>
  <div class="table-wrap"><table>
    <colgroup><col class="col-no"><col><col class="col-pos"><col class="col-pos"><col class="col-pos"><col class="col-pos"><col class="col-result"><col class="col-tester"><col class="col-note"></colgroup>
    <thead><tr><th class="col-no">#</th><th class="th-item">驗證項目 / 機台</th><th>商場POS</th><th>MPOS</th><th>票務人工POS</th><th>紀念品POS</th><th>結果</th><th>測試人員</th><th>備註</th></tr></thead>
    <tbody>${rowsHtml}</tbody>
  </table></div>
  <div class="report-footer">
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#eef3f1;color:#5c7a6e;border:1px solid #a8c4bb">○</div> Pass</div>
      <div class="legend-item"><div class="legend-dot" style="background:#fdf0ec;color:#b05a3a;border:1px solid #d4a090">✕</div> Fail</div>
      <div class="legend-item"><div class="legend-dot" style="background:#faf5e8;color:#8b7355;border:1px solid #c8b89a">△</div> 部分通過</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f5f3ef;color:#9b9289;border:1px solid #cdc7bc">—</div> 跳過</div>
      <div class="legend-item" style="margin-left:6px;padding-left:6px;border-left:1px solid #e2ddd6"><div class="legend-dot" style="background:#5c7a6e;color:#fff;font-size:7px">銷</div> 銷售</div>
      <div class="legend-item"><div class="legend-dot" style="background:#b05a3a;color:#fff;font-size:7px">退</div> 退款</div>
    </div>
    <div class="doc-id">產出：${today} · TEST ENV</div>
  </div>
</div></body></html>`;
  const win=window.open('','_blank');win.document.write(html);win.document.close();
  closeModalDirect();showToast('✓ 列印清單已開啟');
}

function getVerifyItems(system){
  if(OTHER_SYSTEMS.includes(system)){
    return[
      {label:'銷售'},{label:'退貨'},{label:'多重支付'},{label:'隔日退貨'},
      {label:'會員登錄'},{label:'外交官交易'},
      {label:'',isCustom:true},{label:'',isCustom:true},{label:'',isCustom:true},
    ];
  }
  const base=[
    {label:'銷售：新支付 100元'},{label:'當日退：新支付 100元'},
    {label:'銷售：新支付 10+現金50'},{label:'當日退：新支付 10+現金50'},
    {label:'銷售：新支付 10+LINEPAY 50'},{label:'當日退：新支付 10+ LINEPAY 50'},
    {label:'銷售：新支付 50元+電子禮券 50元'},{label:'當日退：新支付 50元+電子禮券 50元'},
    {label:'銷售：新支付 50元+電子禮券 50元（需人工後台退款）',pos:'無後台',mpos:'-',tpos:'-',kpos:'-',note:'需人工後台操作'},
    {label:'銷售：新支付 50+點數100點(25元)'},{label:'當日退：新支付 50+點數100點(25元)'},
    {label:'銷售：新支付 1元'},{label:'隔日退：新支付 1元'},
    {label:'',isCustom:true},{label:'',isCustom:true},{label:'',isCustom:true},
  ];
  if(system==='GLNPAY'){base.splice(-3,0,{label:'虛擬鍵盤輸入密碼',note:'需使用畫面上鍵盤，不可直接鍵入'},{label:'國家選擇 Taiwan',note:'下拉選單確認顯示正確'});}
  if(system==='台新PAY'){base.splice(-3,0,{label:'裝置綁定驗證 (000000)',note:'綁定完成後方可付款'},{label:'OTP 驗證 (123456)',note:''});}
  return base;
}

function showToast(msg,type){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='toast'+(type==='err'?' err':'');
  el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2800);
}
</script>
</body>
</html>
